# herdr configuration
# Place this file at ~/.config/herdr/config.toml

# Show first-run notification setup on startup.
# Missing also shows onboarding; set false after you've chosen.
onboarding = false

[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper
# name = "one-dark"
name = "catppuccin"
# Follow the host terminal's light/dark appearance.
# auto_switch = true
# dark_name = "catppuccin"          # mocha
# light_name = "catppuccin-latte"

auto_switch = false
[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[ui]
show_agent_labels_on_pane_borders = false
