[settings]
legacy_version_file = false                      # enabled by default (different than asdf)
plugin_autoupdate_last_check_duration = '1 week' # set to 0 to disable updates

verbose = false     # set to true to see full installation output, see `RTX_VERBOSE`
asdf_compat = false # set to true to ensure .tool-versions will be compatible with asdf, see `RTX_ASDF_COMPAT`
jobs = 4            # number of plugins or runtimes to install in parallel. The default is `4`.
raw = false         # set to true to directly pipe plugins to stdin/stdout/stderr

experimental = false                                # enable experimental features such as shims
idiomatic_version_file_enable_tools = ["terraform"]

[tools]
helm = "4.0.0"
helm-cr = '1.4.1'
helm-ct = "3.11.0"
k9s = "0.50.18"
terraform-docs = '0.16.0'
tflint = '0.42.2'
vault = "1.15.4"
k6 = "0.49.0"
xh = "0.22.2"
pint = "0.64.0"
terraform = "1.13.1"
trivy = "0.74.0"
talhelper = "3.0.5"
terragrunt = "latest"
promtool = "latest"
kustomize = "5.4.3"
kind = "0.30.0"
opa = "1.9.0"
helm-docs = "1.14.2"
duckdb = "1.3.0"
dive = "latest"
oras = "1.2.3"
prek = "0.2.28"
grype = "0.103.0"
kubectl = "1.34.0"
podman = "5.7.0"
krew = "0.4.5"
zellij = "latest"
aws-cli = { version = "2.33.15", symlink_bins = "true" }
atuin = "18.12.1"
fnox = "latest"
