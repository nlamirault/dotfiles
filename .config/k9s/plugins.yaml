plugins:
  #--- Create debug container for selected pod in current namespace
  # See https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/#ephemeral-container
  debug:
    shortCut: Shift-D
    description: Add debug container
    dangerous: true
    scopes:
      - containers
    command: bash
    background: false
    confirm: true
    args:
      - -c
      - "kubectl --kubeconfig=$KUBECONFIG debug -it --context $CONTEXT -n=$NAMESPACE $POD --target=$NAME --image=nicolaka/netshoot:v0.13 --share-processes -- bash"
  dive:
    shortCut: d
    confirm: false
    description: "Dive image"
    scopes:
      - containers
    command: dive
    background: false
    args:
      - $COL-IMAGE
  gonzo:
    shortCut: Ctrl-L
    description: "Gonzo log analysis"
    scopes:
    - po
    command: sh
    background: false
    args:
    - -c
    - "kubectl logs -f $NAME -n $NAMESPACE --context $CONTEXT | gonzo"
  #--- Display cleaned manifest without managedFields/status noise (requires kubectl-neat)
  neat:
    shortCut: Ctrl-N
    description: "Neat manifest"
    scopes:
      - all
    command: bash
    background: false
    args:
      - -c
      - "kubectl --context $CONTEXT -n $NAMESPACE get $RESOURCE_NAME $NAME -o yaml | kubectl neat | less"
  #--- Multi-pod log tailing for a deployment (requires stern)
  stern:
    shortCut: Ctrl-S
    description: "Stern multi-pod logs"
    scopes:
      - deployments
    command: stern
    background: false
    args:
      - --context=$CONTEXT
      - -n=$NAMESPACE
      - $NAME
